name: OLX Odesa monitor

on:
  # Расписание запускает внешний будильник cron-job.org (см. README) -
  # он надёжнее внутреннего schedule-триггера GitHub, который может
  # задерживаться на час и более при частых интервалах.
  workflow_dispatch:

# Если новый триггер приходит, пока предыдущий прогон ещё выполняется -
# отменяем предыдущий и сразу стартуем новый (cancel-in-progress: true).
# Это защищает от сценария "один прогон завис -> все следующие стоят в
# очереди позади него" (именно так один зависший на 35 минут шаг установки
# браузера задержал вообще все уведомления на этот период).
concurrency:
  group: olx-monitor
  cancel-in-progress: true

# Общий предохранитель: если что-то всё же зависнет (например, сама
# установка браузера или сеть до OLX) - принудительно обрываем прогон
# через 5 минут вместо того чтобы висеть неограниченно долго.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Playwright browser
        timeout-minutes: 3
        run: playwright install --with-deps chromium
        # Не пропускаем даже при попадании в кэш - "--with-deps" также
        # ставит нужные системные библиотеки, это быстро при готовом кэше.
        # timeout-minutes: если apt/сеть зависнут (редко, но бывает на
        # раннерах GitHub) - прогон упадёт за 3 минуты вместо 30+.

      - name: Run monitor
        env:
          OLX_SEARCH_URL: ${{ secrets.OLX_SEARCH_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_NOTIFY_CHAT_ID: ${{ secrets.TELEGRAM_NOTIFY_CHAT_ID }}
          TELEGRAM_NOTIFY_THREAD_ID: ${{ secrets.TELEGRAM_NOTIFY_THREAD_ID }}
        run: python main.py

      - name: Save seen.json back to repo
        run: |
          git config user.name "olx-bot"
          git config user.email "olx-bot@users.noreply.github.com"
          git add seen.json
          git add bot_state.json
          git diff --staged --quiet || git commit -m "update seen ads"
          git pull --rebase --autostash
          git push
